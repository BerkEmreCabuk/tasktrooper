name: release-mac

# The thing a person installs. A `v*` tag builds the universal .app, signs it
# with whatever material this repository has, and publishes the dmg, the zip and
# `latest-mac.yml` to that tag's GitHub Release — the feed services/updater.ts reads.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 90
    environment: Release
    defaults:
      run:
        shell: bash
        working-directory: desktop
    env:
      # The backend links tree-sitter, whose grammars are C. Cgo off fails every
      # one of them with "build constraints exclude all Go files".
      CGO_ENABLED: "1"

    steps:
      - uses: actions/checkout@v4

      # The bundled version is what the updater compares against the feed, so a
      # tag that disagrees with it ships an app that either re-offers itself
      # forever or never sees the release. Ten seconds here, not forty minutes in.
      - name: Check the tag against the packaged version
        id: version
        working-directory: .
        run: |
          set -euo pipefail
          version="$(node -p "require('./desktop/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          tag="${GITHUB_REF_NAME#v}"
          if [ "${{ github.ref_type }}" = "tag" ] && [ "$tag" != "$version" ]; then
            echo "::error title=Tag and version disagree::$GITHUB_REF_NAME names $tag, desktop/package.json says $version."
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            desktop/ui/package-lock.json

      - name: Install and build
        run: |
          npm ci
          npm --prefix ui ci
          npm run build
          npm run build:ui
          npm run build:server:universal
          npm run build:embedder

      # @electron/notarize wants APPLE_API_KEY to be a *path* to the .p8 and the
      # secret holds base64 of it, so it becomes a file outside the workspace
      # where no glob can pick it up. `-c.mac.identity=-` is ad-hoc signing, not
      # "unsigned": an arm64 Mach-O with no signature at all cannot execute.
      - name: Work out the signing material
        id: sign
        working-directory: .
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: |
          set -euo pipefail
          if [ -n "${APPLE_API_KEY_B64:-}" ]; then
            install -d -m 700 "$RUNNER_TEMP/asc"
            printf '%s' "$APPLE_API_KEY_B64" | base64 --decode > "$RUNNER_TEMP/asc/AuthKey.p8"
            chmod 600 "$RUNNER_TEMP/asc/AuthKey.p8"
            grep -q "BEGIN PRIVATE KEY" "$RUNNER_TEMP/asc/AuthKey.p8" \
              || { echo "::error title=APPLE_API_KEY is not a base64 .p8::Re-run: base64 -i AuthKey_XXXX.p8 | pbcopy"; exit 1; }
            echo "apikey=$RUNNER_TEMP/asc/AuthKey.p8" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${CSC_LINK:-}" ]; then
            printf "args=\nsigned=true\n" >> "$GITHUB_OUTPUT"
            echo "Signed with the Developer ID certificate in CSC_LINK." >> "$GITHUB_STEP_SUMMARY"
          else
            printf "args=-c.mac.identity=-\nsigned=false\n" >> "$GITHUB_OUTPUT"
            echo "**Ad-hoc signed** (no CSC_LINK secret), so not notarized: the first launch needs right-click → Open, or \`xattr -dr com.apple.quarantine\`." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Package and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ steps.sign.outputs.apikey }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          IDENTITY: ${{ steps.sign.outputs.args }}
        run: |
          # An absent secret arrives as an empty string, and electron-builder
          # reads an empty CSC_LINK as a certificate path: the working directory.
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [ -n "${!name:-}" ] || unset "$name"
          done
          npx electron-builder --mac --publish always \
            -c.publish.provider=github -c.publish.owner=makifbaysal -c.publish.repo=tasktrooper \
            -c.publish.releaseType=release ${IDENTITY:+"$IDENTITY"}

      # electron-builder reporting success is not evidence. The failure that
      # matters is an app that packages and notarizes cleanly and is refused on
      # the user's Mac because one Mach-O in Resources/bin was never signed.
      - name: Verify the artifact
        run: |
          set -euo pipefail
          app="release/mac-universal/TaskTrooper.app"
          [ -d "$app" ] || { echo "::error::$app was not produced"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"
          for f in Contents/Resources/bin/agent-server Contents/Resources/web/index.html Contents/Resources/embedder/index.cjs; do
            [ -e "$app/$f" ] || { echo "::error title=Missing from the bundle::$f"; exit 1; }
          done
          lipo -archs "$app/Contents/Resources/bin/agent-server"
          if [ "${{ steps.sign.outputs.signed }}" = "true" ] && [ -n "${{ steps.sign.outputs.apikey }}" ]; then
            xcrun stapler validate "$app"
            spctl --assess -t exec -vv "$app"
          fi
          echo "TaskTrooper ${{ steps.version.outputs.version }}: $(find release -maxdepth 1 \( -name '*.dmg' -o -name '*.zip' \) -print | sed 's#.*/##' | tr '\n' ' ')" >> "$GITHUB_STEP_SUMMARY"
